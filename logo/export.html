<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Logo · export · damienpugin]</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=author@300,500,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FAF7F2;
    --ink: #0A0A0A;
    --vermilion: #F04E30;
    --hairline: #ECE5D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #888;
    font-family: 'Author', system-ui, sans-serif;
    padding: 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .frame {
    border: 1px dashed rgba(255,255,255,0.4);
    padding: 80px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .frame::after {
    content: attr(data-label);
    position: absolute;
    top: 8px; left: 12px;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .frame.light { background: var(--paper); }
  .frame.dark { background: var(--ink); }
  .frame.transparent {
    background:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #fff;
  }

  .wm {
    font-family: 'Author', system-ui, sans-serif;
    line-height: 1;
    display: inline-flex;
    align-items: baseline;
  }
  .wm .a { font-weight: 300; letter-spacing: -0.005em; }
  .wm .b { font-weight: 700; letter-spacing: -0.02em; }
  .wm .br { color: var(--vermilion); font-weight: 500; margin-left: 0.04em; }

  .size-l { font-size: 160px; }
  .size-m { font-size: 96px; }
  .size-s { font-size: 56px; }

  .ink-text { color: var(--ink); }
  .paper-text { color: var(--paper); }

  .mark {
    font-family: 'Author', system-ui, sans-serif;
    font-weight: 500;
    color: var(--vermilion);
    line-height: 1;
  }
  .mark.size-l { font-size: 240px; }
  .mark.size-m { font-size: 120px; }
  .mark.size-s { font-size: 64px; }
</style>
</head>
<body>
<div class="grid">

  <!-- Wordmark — light variants -->
  <div class="frame light" data-label="Wordmark · ink sur paper · 160px">
    <span class="wm size-l ink-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <div class="frame light" data-label="Wordmark · ink sur paper · 96px">
    <span class="wm size-m ink-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <!-- Wordmark — dark variants -->
  <div class="frame dark" data-label="Wordmark · paper sur ink · 160px">
    <span class="wm size-l paper-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <div class="frame dark" data-label="Wordmark · paper sur ink · 96px">
    <span class="wm size-m paper-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <!-- Wordmark — transparent (pour PNG transparent) -->
  <div class="frame transparent" data-label="Wordmark · ink sur transparent · 160px">
    <span class="wm size-l ink-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <div class="frame transparent" data-label="Wordmark · paper sur transparent · 160px">
    <span class="wm size-l paper-text"><span class="a">damien</span><span class="b">pugin</span><span class="br">]</span></span>
  </div>

  <!-- Mark seul -->
  <div class="frame light" data-label="Mark · ] sur paper · 240px">
    <span class="mark size-l">]</span>
  </div>

  <div class="frame dark" data-label="Mark · ] sur ink · 240px">
    <span class="mark size-l">]</span>
  </div>

  <div class="frame transparent" data-label="Mark · ] transparent · 240px">
    <span class="mark size-l">]</span>
  </div>

</div>
</body>
</html>
